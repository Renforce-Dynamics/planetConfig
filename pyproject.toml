[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Renforce Dynamics"}]
maintainers = [{name = "Renforce Dynamics"}]
readme = "README.md"
license = {file = "LICENSE"}
name = "planet-config"
version = "0.1.0"
requires-python = ">=3.10"
description = "Layered configuration, resource provenance and reproducible snapshots"
dependencies = ["PyYAML>=6"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["planet_config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/Renforce-Dynamics/planetConfig"
Issues = "https://github.com/Renforce-Dynamics/planetConfig/issues"
Documentation = "https://github.com/Renforce-Dynamics/planetConfig#readme"

[project.scripts]
planet-config = "planet_config.__main__:main"
